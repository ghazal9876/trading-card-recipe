<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heroes of the Wild Sky</title><style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=DM+Sans:wght@500;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#f8efd8;font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 50% 15%,#57402b 0,transparent 35%),linear-gradient(135deg,#17120f,#302218 50%,#0f1213)}main{width:min(100% - 2rem,54rem);padding:4rem 1rem;text-align:center;border:1px solid #b99758;border-radius:2rem;background:#17120fcc;box-shadow:0 1.5rem 5rem #0009}.logo{font-size:6rem}.kicker{color:#d5ae63;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase}h1{margin:.7rem auto;color:#f5d58b;font:900 clamp(3rem,10vw,7rem)/.9 Cinzel;letter-spacing:-.08em;max-width:10ch}.rules{max-width:38rem;margin:1.5rem auto;color:#c6bda9;font-size:1.1rem;line-height:1.6}button{padding:1rem 1.4rem;border:1px solid #d5ae63;border-radius:999px;color:#251b11;background:#e0bb66;font:700 .9rem 'DM Sans';cursor:pointer}button:hover{background:#f5d58b;transform:translateY(-2px)}#setup{display:none;max-width:28rem;margin:2rem auto 0;padding:1.4rem;border:1px solid #765739;border-radius:1rem;background:#211d1c;text-align:left}label{display:block;margin-bottom:.5rem;color:#d5ae63;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}select,input{width:100%;margin-bottom:1rem;padding:.85rem;border:1px solid #765739;border-radius:.6rem;color:#f8efd8;background:#171618;font:1rem 'DM Sans'}#play{width:100%}</style></head><body><main><div class="logo">🐉</div><p class="kicker">The Mythic Archive</p><h1>Heroes of the Wild Sky</h1><p class="rules">Match every pair of fantasy creature cards. Flip two cards per turn, earn two points for each match, and the player with the highest score wins.</p><button id="start" type="button">Start Game →</button><section id="setup"><label for="count">Number of players</label><select id="count"><option value="1">1 Player</option><option value="2" selected>2 Players</option></select><label for="player-one">Player 1 name</label><input id="player-one" maxlength="18" placeholder="Player 1"><div id="second"><label for="player-two">Player 2 name</label><input id="player-two" maxlength="18" placeholder="Player 2"></div><button id="play" type="button">Continue to Game →</button></section></main><script>const setup=document.querySelector('#setup'),count=document.querySelector('#count'),second=document.querySelector('#second');document.querySelector('#start').addEventListener('click',()=>{setup.style.display='block';document.querySelector('#start').style.display='none'});count.addEventListener('change',()=>{second.style.display=count.value==='2'?'block':'none'});document.querySelector('#play').addEventListener('click',()=>{const p1=encodeURIComponent(document.querySelector('#player-one').value.trim()||'Player 1');const p2=encodeURIComponent(document.querySelector('#player-two').value.trim()||'Computer');window.location.href='game.html?players='+count.value+'&p1='+p1+'&p2='+p2});</script></body></html>
